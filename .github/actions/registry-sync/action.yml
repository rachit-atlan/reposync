name: Registry Sync
description: Preview and publish Git-managed skills to Atlan Agent Registry.
author: Atlan

branding:
  icon: upload-cloud
  color: purple

inputs:
  workspace:
    description: Atlan workspace ID that artifacts publish to and preflight compares with. Leave it unset when the repository's `.registry/config.yml` names the workspace.
    required: false
  artifacts:
    description: "Globs per kind, one line each, for example `skill: [\"skills/**\", \"team-b/skills/**\"]` and `agent: \"agents/**\"`. Only tracked files match. Leave it unset when the repository's `.registry/config.yml` lists the skills; setting both is an error."
    required: false
  preflight:
    description: Check pull requests before they merge. Preflight validates each changed skill and compares it with the Registry; publishing leaves validation to the Registry.
    required: false
    default: "true"
  allow-pr-commenting:
    description: Post the preflight result as one pull request comment. A pull request that touches no listed folder gets no comment.
    required: false
    default: "true"
  fail-on-conflict:
    description: Fail preflight after commenting when a confirmed Registry conflict exists.
    required: false
    default: "true"
  github-token:
    description: GitHub token that reads pull requests, writes the preflight comment, and reports a failed publish on the merged pull request.
    required: false
    default: ${{ github.token }}
  working-directory:
    description: Repository directory the artifacts globs are relative to.
    required: false
    default: .
  prune:
    description: Not supported with aireg yet; publish fails unless it is "false".
    required: false
    default: "false"

outputs:
  status:
    description: success when the selected mode completes without a confirmed conflict; conflict when preflight reports one.
  cli-version:
    description: The CLI version installed and executed by this Action.
  comment-id:
    description: GitHub comment ID created or updated by preflight.
  conflict-count:
    description: Number of confirmed workspace-level Registry conflicts found by preflight.
  rejected-count:
    description: Number of changed skills whose SKILL.md the Registry would reject on publish (HTTP 422).

runs:
  using: node24
  main: dist/index.mjs
