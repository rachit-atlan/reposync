name: Registry Sync

# Test harness: the Action is vendored at .github/actions/registry-sync from the
# v1.1.1 release (bde5988). A consumer uses atlanai/agent-registry-action@v1.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: registry-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Shows on the pull request what merging publishes; aireg reads the pull request's files and never runs them.
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: registry
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/registry-sync
        with:
          fail-on-conflict: "false"
        env:
          AIREG_TOKEN_ATLAN: ${{ secrets.REGISTRY_TOKEN }}

  # Publishes the exports .registry/manifest.yml declares, to its publish.to target.
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: registry
    permissions:
      contents: read
      pull-requests: write  # comments on the merged pull request when publishing fails
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/registry-sync
        env:
          AIREG_TOKEN_ATLAN: ${{ secrets.REGISTRY_TOKEN }}
