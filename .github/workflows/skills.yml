name: skills
on:
  pull_request: { paths: [".claude/skills/**"] }
  push: { branches: [main], paths: [".claude/skills/**"] }
permissions: { contents: read }
jobs:
  check:                                    # pull requests: validate only, no token
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: curl -fsSL https://app.atlan.com/registry/cli/install.sh | sh
      - run: registry adapter install atlan@0.1.13
      - name: validate every skill          # the registry validator, on a throwaway registry
        run: |
          reg="$RUNNER_TEMP/registry-check"
          registry marketplace init "$reg" > /dev/null
          registry marketplace add "$reg" --as scratch > /dev/null
          registry publish '.claude/skills/*' --to scratch/check --yes
          GITHUB_BASE_REF= registry marketplace validate "$reg"

  publish:                                  # main: publish what changed
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: registry                   # its token is released to main only
    concurrency: { group: skills-publish, cancel-in-progress: false }
    env: { REGISTRY_TOKEN_REGISTRY_CLI_TEST: "${{ secrets.REGISTRY_TOKEN }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: curl -fsSL https://app.atlan.com/registry/cli/install.sh | sh
      - run: registry adapter install atlan@0.1.13
      - run: registry publish '.claude/skills/*' --yes
