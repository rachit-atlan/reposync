name: leak-test
on:
  push: { branches-ignore: [main] }
permissions: { contents: read }
jobs:
  try-secret:                                     # a branch asking for the main-only environment
    runs-on: ubuntu-latest
    environment: registry
    steps:
      - run: '[ -n "$T" ] && echo "LEAK: token visible on $REF" || echo "no token on $REF"'
        env: { T: '${{ secrets.REGISTRY_TOKEN }}', REF: '${{ github.ref_name }}' }
