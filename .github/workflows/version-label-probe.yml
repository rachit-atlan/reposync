name: version_label probe (temporary)

# Checks whether Atlan's skill bulk create keeps a `version_label` it is sent.
# Writes only to the registry-cli-test workspace; removed after the check.
on: workflow_dispatch

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: registry
    permissions:
      contents: read
    steps:
      - name: Probe version_label on bulk create
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          WS: workspace_01m36rz0zdfc1ttjvtj0h9b87j
        run: |
          set -euo pipefail
          api=https://api.atlan.com/skill/v1
          work=$(mktemp -d); trap 'rm -rf "$work"' EXIT
          get() { curl -sS -H "Authorization: Bearer $TOKEN" "$api$1"; }
          show() { jq -c '{id, name, version_ordinal, version_label, source_type, source_id, source_version}'; }
          line() { get "/skills?workspace_id=$WS&limit=200" | jq -c --arg n "$1" '[(.items // .data // .)[] | select(.name == $n)] | first'; }
          upload() { # name label body [extra metadata JSON]
            local name=$1 label=$2 body=$3 extra=${4:-'{}'}
            mkdir -p "$work/$name"
            printf -- '---\nname: %s\ndescription: Throwaway skill for a version_label check. Safe to delete.\n---\n%s\n' "$name" "$body" > "$work/$name/SKILL.md"
            rm -f "$work/$name.zip"; (cd "$work/$name" && zip -q -X "$work/$name.zip" SKILL.md)
            local items
            items=$(jq -nc --arg n "$name" --arg w "$WS" --arg l "$label" --argjson x "$extra" \
              '[{metadata: ({name: $n, workspace_id: $w, version_label: $l, source_type: "local"} + $x), body_part: "body_0"}]')
            local code
            code=$(curl -sS -o "$work/out.json" -w '%{http_code}' -X POST "$api/skills/bulk" \
              -H "Authorization: Bearer $TOKEN" -F "items=$items" -F "body_0=@$work/$name.zip;type=application/zip")
            echo "POST /skills/bulk $name label=$label -> HTTP $code"
            jq -c '(.items // .results // .) | map({status: (.status // null), id: (.skill.id // .data.id // .id // null), version_label: (.skill.version_label // .data.version_label // .version_label // null), version_ordinal: (.skill.version_ordinal // .data.version_ordinal // .version_ordinal // null), problem: ((.problem // .error // {}) | {title, detail, status})})' "$work/out.json" 2>/dev/null \
              || head -c 1500 "$work/out.json"
          }

          patch() { # id label
            local code
            code=$(curl -sS -o "$work/patch.json" -w '%{http_code}' -X PATCH "$api/skills/$1" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$(jq -nc --arg l "$2" '{version_label: $l}')")
            echo "PATCH /skills/$1 version_label=$2 -> HTTP $code"
            jq -c '{version_ordinal, version_label, title, detail, status}' "$work/patch.json" 2>/dev/null || head -c 600 "$work/patch.json"
          }
          name=version-label-patch-1015

          echo "== 1. Upload version 1, then PATCH version_label 0.1.0:"
          upload $name 0.1.0 "first"
          id=$(line $name | jq -r '.id // empty'); echo "id=$id"
          patch "$id" 0.1.0
          echo "   skill:     $(get "/skills/$id" | show)"
          echo "   version 1: $(get "/skills/$id/versions/1" | show)"
          echo "   list row:  $(line $name | show)"

          echo "== 2. Upload version 2 (no PATCH yet):"
          upload $name 0.1.1 "second"
          echo "   skill:     $(get "/skills/$id" | show)"
          echo "   list row:  $(line $name | show)"

          echo "== 3. PATCH version_label 0.1.1 on the new head:"
          patch "$id" 0.1.1
          echo "   skill:     $(get "/skills/$id" | show)"
          echo "   version 1: $(get "/skills/$id/versions/1" | show)"
          echo "   version 2: $(get "/skills/$id/versions/2" | show)"
          echo "   list row:  $(line $name | show)"

          echo "== 4. Archive the probe skill:"
          [ -n "$id" ] && curl -sS -o /dev/null -w 'POST archive -> HTTP %{http_code}\n' -X POST -H "Authorization: Bearer $TOKEN" "$api/skills/$id/archive"
