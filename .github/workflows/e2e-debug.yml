name: Registry Sync debug (temporary)

# Runs aireg 0.1.7 with the adapter build from atlanai/registry-cli#218 and a request log
# (method, host, path, status). Writes only to registry-cli-test; removed after.
on:
  push:
    branches: [e2e1023/debug]

permissions: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: registry
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atlanai/ai-registry
          ref: cf194ce64009d10c0d97ffedb24b821830b4cf4b # aireg-v0.1.7
          path: .aireg-src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .aireg-src/cli/.node-version
          package-manager-cache: false
      - name: Build aireg 0.1.7
        working-directory: .aireg-src/cli
        run: |
          npm install --global --force corepack@0.34.6 && corepack enable pnpm
          pnpm install --frozen-lockfile
          pnpm run build
      - name: "A: the agents 0.1.17 left half-created"
        env:
          AIREG_TOKEN_ATLAN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          export AIREG_MAIN="$PWD/.aireg-src/cli/dist/main.mjs" LOGGER="$PWD/e2e1023/debug/fetch-log.mjs" ADAPTER="$PWD/e2e1023/debug/adapter.mjs"
          e2e1023/debug/run.sh A .
      - name: "A again: nothing changed"
        env:
          AIREG_TOKEN_ATLAN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          export AIREG_MAIN="$PWD/.aireg-src/cli/dist/main.mjs" LOGGER="$PWD/e2e1023/debug/fetch-log.mjs" ADAPTER="$PWD/e2e1023/debug/adapter.mjs"
          e2e1023/debug/run.sh A2 .
      - name: "B: a new skill and its agent in one run"
        env:
          AIREG_TOKEN_ATLAN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          export AIREG_MAIN="$PWD/.aireg-src/cli/dist/main.mjs" LOGGER="$PWD/e2e1023/debug/fetch-log.mjs" ADAPTER="$PWD/e2e1023/debug/adapter.mjs"
          e2e1023/debug/run.sh B e2e1023/debug/fresh
